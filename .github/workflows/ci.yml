name: CI

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Check lints (Clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release

  package:
    name: Build Ubuntu package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Debian package
        run: ./scripts/build-deb.sh "${{ github.ref_name }}"

      - name: Install and verify Debian package
        run: |
          sudo apt-get install -y ./dist/*.deb
          installed_version=$(unburn --version)
          expected_version="unburn ${GITHUB_REF_NAME#v}"
          test "$installed_version" = "$expected_version"
          echo "Installed $installed_version"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: unburn-${{ github.ref_name }}-${{ runner.arch }}
          path: dist/*.deb
          if-no-files-found: error
