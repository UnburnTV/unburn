[package]
name = "unburn"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Display uniformity compensator: a transparent overlay that evens out spatial brightness defects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unburn/unburn"
readme = "README.md"
keywords = ["display", "uniformity", "wayland", "x11", "overlay"]
categories = ["gui"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
rustix = { version = "1.1", features = ["event", "fs", "pipe", "std"] }

# GUI (controller window only; overlays never go through this stack)
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"

# Wayland overlay backend
smithay-client-toolkit = "0.21"
wayland-client = "0.31"

# X11 overlay backend
x11rb = { version = "0.14", features = ["randr", "shape", "xfixes"] }

# Monitor identity, one interface per desktop. Neither wl_output nor XRandR
# under XWayland reveals a serial number, so each desktop is asked through the
# only interface it offers. See `platform::identity` for why this is not done by
# reading the kernel's EDID files instead.
zbus = { version = "5.13", default-features = false, features = [
    "blocking-api",
    "async-io",
] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
# Plasma hands the EDID over as base64 rather than raw bytes.
base64 = "0.23"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
